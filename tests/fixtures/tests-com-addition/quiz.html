<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Free Math Practice Tests, Addition</title>
  <!-- Replica of the quiz structure PumpkinEater scanned on tests.com (see run.json):
       two display checkboxes, then 20 fieldsets of radios in the site's option order. -->
</head>

  <div class="display-options">
    <label><input type="checkbox" id="GradeAsYouGo-checkbox" name="GradeAsYouGo-checkbox"> View Answers as You Go</label>
    <label><input type="checkbox" id="OneQuestionAtATime-checkbox" name="OneQuestionAtATime-checkbox"> View 1 Question at a Time</label>
  </div>

  <script>
    // Every click on an answer is recorded, so tests can prove a wrong option was never clicked.
    window.clicks = [];
    document.addEventListener('click', (e) => { if (e.target.matches('input[type=radio]')) window.clicks.push(e.target.id); }, true);
  </script>
</body>
</html>
